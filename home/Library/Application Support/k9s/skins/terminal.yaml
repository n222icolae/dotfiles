# Uses the terminal's ANSI palette, so it follows the terminal theme
foreground: &foreground default
background: &background default
black: &black black
grey: &grey gray
blue: &blue navy
blue_light: &blue_light blue
green: &green green
green_light: &green_light lime
yellow: &yellow olive
yellow_light: &yellow_light yellow
red: &red maroon
purple: &purple fuchsia
cyan: &cyan teal
cyan_light: &cyan_light aqua
k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *green_light
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *yellow
  info:
    fgColor: *grey
    sectionColor: *green_light
  help:
    fgColor: *foreground
    bgColor: *background
    keyColor: *yellow_light
    numKeyColor: *blue_light
    sectionColor: *purple
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *grey
    buttonFocusFgColor: *black
    buttonFocusBgColor: *blue_light
    labelFgColor: *yellow
    fieldFgColor: *blue_light
  frame:
    border:
      fgColor: *grey
      focusColor: *blue_light
    menu:
      fgColor: *grey
      keyColor: *yellow_light
      numKeyColor: *yellow_light
    crumbs:
      fgColor: *black
      bgColor: *blue_light
      activeColor: *yellow_light
    status:
      newColor: *cyan_light
      modifyColor: *yellow
      addColor: *green
      pendingColor: *yellow
      errorColor: *red
      highlightColor: *yellow_light
      killColor: *purple
      completedColor: *grey
    title:
      fgColor: *blue_light
      bgColor: *background
      highlightColor: *purple
      counterColor: *foreground
      filterColor: *cyan
  views:
    charts:
      bgColor: *background
      defaultDialColors:
        - *green
        - *red
      defaultChartColors:
        - *blue_light
        - *green
        - *purple
        - *cyan
    table:
      fgColor: *foreground
      bgColor: *background
      cursorFgColor: *black
      cursorBgColor: *blue_light
      markColor: *yellow_light
      header:
        fgColor: *grey
        bgColor: *background
        sorterColor: *cyan
    xray:
      fgColor: *blue_light
      bgColor: *background
      cursorColor: *foreground
      graphicColor: *cyan
      showIcons: false
    yaml:
      keyColor: *blue_light
      colonColor: *grey
      valueColor: *foreground
    logs:
      fgColor: *grey
      bgColor: *background
      indicator:
        fgColor: *blue_light
        bgColor: *background
        toggleOnColor: *green
        toggleOffColor: *grey
    help:
      fgColor: *grey
      bgColor: *background
      indicator:
        fgColor: *blue_light
